services:
  qdrant:
    image: qdrant/qdrant:v1.16.2
    container_name: tunicase-qdrant
    restart: unless-stopped

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_storage:/qdrant/storage

    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334

    healthcheck:
      test: [ "CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  qdrant_storage:
    name: tunicase_qdrant_storage
